<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | Rakib's Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
      color: #222;
    }

    header {
      background: #0f766e;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 27px;
    }

    header p {
      margin: 0;
      font-size: 15px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px 15px;
    }

    .topbar {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .topbar h2 {
      margin: 0 0 15px;
      color: #0f766e;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .stat h3 {
      margin: 0 0 8px;
      color: #666;
      font-size: 16px;
    }

    .stat strong {
      font-size: 30px;
      color: #0f766e;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .table-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 13px 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f0fdfa;
      color: #0f766e;
    }

    tr:hover {
      background: #fafafa;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #0f766e;
    }

    .error {
      text-align: center;
      padding: 20px;
      color: red;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    button,
    .home-btn {
      border: none;
      padding: 11px 17px;
      border-radius: 8px;
      background: #0f766e;
      color: white;
      cursor: pointer;
      text-decoration: none;
      font-size: 15px;
    }

    button:hover,
    .home-btn:hover {
      opacity: 0.9;
    }

    .logout {
      background: #dc2626;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 23px;
      }

      .container {
        padding: 12px;
      }

      .topbar,
      .search-box,
      .table-box {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Rakib's Academy Online</h1>
  <p>Admin Dashboard</p>
</header>


<div class="container">

  <div class="topbar">

    <h2>📊 শিক্ষার্থী ব্যবস্থাপনা</h2>

    <div class="buttons">
      <button onclick="loadStudents()">
        🔄 তথ্য Refresh
      </button>

      <a href="index.html" class="home-btn">
        🏠 মূল পেজ
      </a>

      <button class="logout" onclick="logout()">
        🚪 Logout
      </button>
    </div>

  </div>


  <div class="stats">

    <div class="stat">
      <h3>মোট শিক্ষার্থী</h3>
      <strong id="totalStudents">0</strong>
    </div>

    <div class="stat">
      <h3>সর্বশেষ আবেদন</h3>
      <strong id="latestStudents">0</strong>
    </div>

  </div>


  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="🔎 নাম, পিতার নাম, মোবাইল বা শ্রেণি দিয়ে খুঁজুন..."
      oninput="searchStudents()"
    >

  </div>


  <div class="table-box">

    <div id="status" class="loading">
      শিক্ষার্থীদের তথ্য লোড হচ্ছে...
    </div>

    <table id="studentTable" style="display:none;">

      <thead>

        <tr>
          <th>ক্রমিক</th>
          <th>শিক্ষার্থীর নাম</th>
          <th>পিতার নাম</th>
          <th>মাতার নাম</th>
          <th>মোবাইল</th>
          <th>শ্রেণি</th>
          <th>ঠিকানা</th>
          <th>তারিখ</th>
        </tr>

      </thead>

      <tbody id="studentTableBody"></tbody>

    </table>

  </div>

</div>


<script>

  /* ================================
     SUPABASE CONNECTION
     ================================ */

  const SUPABASE_URL =
    "https://ihetuifvfsqdzqkzbrxg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_CBx9Yy8hC-8YYC2F7ZB3Jw_v_BaxZm4";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let allStudents = [];


  /* ================================
     LOAD STUDENTS
     ================================ */

  async function loadStudents() {

    const status =
      document.getElementById("status");

    const table =
      document.getElementById("studentTable");

    status.style.display = "block";

    status.className = "loading";

    status.innerText =
      "শিক্ষার্থীদের তথ্য লোড হচ্ছে...";

    table.style.display = "none";


    const { data, error } =
      await supabaseClient
        .from("students")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      status.className = "error";

      status.innerText =
        "❌ তথ্য লোড করা যায়নি: " +
        error.message;

      return;
    }


    allStudents = data || [];

    document.getElementById(
      "totalStudents"
    ).innerText = allStudents.length;


    document.getElementById(
      "latestStudents"
    ).innerText =
      allStudents.slice(0, 5).length;


    displayStudents(allStudents);
  }


  /* ================================
     DISPLAY STUDENTS
     ================================ */

  function displayStudents(students) {

    const status =
      document.getElementById("status");

    const table =
      document.getElementById("studentTable");

    const tbody =
      document.getElementById("studentTableBody");


    tbody.innerHTML = "";


    if (students.length === 0) {

      table.style.display = "none";

      status.style.display = "block";

      status.className = "empty";

      status.innerText =
        "কোনো শিক্ষার্থীর তথ্য পাওয়া যায়নি।";

      return;
    }


    status.style.display = "none";

    table.style.display = "table";


    students.forEach(function(student, index) {

      const row =
        document.createElement("tr");


      const date =
        student.created_at
          ? new Date(
              student.created_at
            ).toLocaleDateString("bn-BD")
          : "-";


      row.innerHTML = `

        <td>${index + 1}</td>

        <td>${escapeHTML(
          student.full_name || "-"
        )}</td>

        <td>${escapeHTML(
          student.father_name || "-"
        )}</td>

        <td>${escapeHTML(
          student.mother_name || "-"
        )}</td>

        <td>${escapeHTML(
          student.mobile || "-"
        )}</td>

        <td>${escapeHTML(
          student.class_name || "-"
        )}</td>

        <td>${escapeHTML(
          student.address || "-"
        )}</td>

        <td>${date}</td>

      `;


      tbody.appendChild(row);

    });

  }


  /* ================================
     SEARCH
     ================================ */

  function searchStudents() {

    const query =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    if (!query) {

      displayStudents(allStudents);

      return;
    }


    const filtered =
      allStudents.filter(function(student) {

        return (

          (student.full_name || "")
            .toLowerCase()
            .includes(query)

          ||

          (student.father_name || "")
            .toLowerCase()
            .includes(query)

          ||

          (student.mother_name || "")
            .toLowerCase()
            .includes(query)

          ||

          (student.mobile || "")
            .toLowerCase()
            .includes(query)

          ||

          (student.class_name || "")
            .toLowerCase()
            .includes(query)

        );

      });


    displayStudents(filtered);

  }


  /* ================================
     SECURITY
     ================================ */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ================================
     LOGOUT
     ================================ */

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "login.html";

  }


  /* ================================
     START
     ================================ */

  loadStudents();

</script>

</body>
</html>
