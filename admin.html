<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - Rakib's Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #0f766e;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 7px;
    }

    header p {
      font-size: 15px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px 15px;
    }

    .top-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .top-card h2 {
      color: #0f766e;
      margin-bottom: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .stat h3 {
      color: #666;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .stat strong {
      color: #0f766e;
      font-size: 30px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      border: none;
      border-radius: 9px;
      background: #0f766e;
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-size: 15px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .search {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }

    .search input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .table-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f0fdfa;
      color: #0f766e;
      white-space: nowrap;
    }

    tr:hover {
      background: #fafafa;
    }

    .status {
      text-align: center;
      padding: 25px;
      font-weight: bold;
    }

    .error {
      color: red;
    }

    .empty {
      color: #777;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 23px;
      }

      .container {
        padding: 12px;
      }

      .top-card,
      .search,
      .table-box {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Rakib's Academy Online</h1>
    <p>Admin Dashboard</p>
  </header>


  <main class="container">

    <div class="top-card">

      <h2>📊 শিক্ষার্থী ব্যবস্থাপনা</h2>

      <div class="actions">

        <button class="btn" onclick="loadStudents()">
          🔄 Refresh
        </button>

        <a href="index.html" class="btn">
          🏠 মূল পেজ
        </a>

      </div>

    </div>


    <div class="stats">

      <div class="stat">
        <h3>👨‍🎓 মোট শিক্ষার্থী</h3>
        <strong id="totalStudents">0</strong>
      </div>

      <div class="stat">
        <h3>📝 মোট আবেদন</h3>
        <strong id="totalApplications">0</strong>
      </div>

    </div>


    <div class="search">

      <input
        type="text"
        id="searchInput"
        placeholder="🔎 নাম, পিতার নাম, মোবাইল বা শ্রেণি দিয়ে খুঁজুন..."
        oninput="searchStudents()"
      >

    </div>


    <div class="table-box">

      <div id="status" class="status">
        শিক্ষার্থীদের তথ্য লোড হচ্ছে...
      </div>

      <table id="studentTable" style="display:none;">

        <thead>

          <tr>
            <th>ক্রমিক</th>
            <th>শিক্ষার্থীর নাম</th>
            <th>পিতার নাম</th>
            <th>মাতার নাম</th>
            <th>মোবাইল</th>
            <th>শ্রেণি</th>
            <th>ঠিকানা</th>
            <th>তারিখ</th>
          </tr>

        </thead>

        <tbody id="studentTableBody"></tbody>

      </table>

    </div>

  </main>


  <script>

    /* =========================
       SUPABASE CONFIGURATION
       ========================= */

    const SUPABASE_URL =
      "https://ihetuifvfsqdzqkzbrxg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_CBx9Yy8hC-8YYC2F7ZB3Jw_v_BaxZm4";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let allStudents = [];


    /* =========================
       LOAD STUDENTS
       ========================= */

    async function loadStudents() {

      const status =
        document.getElementById("status");

      const table =
        document.getElementById("studentTable");


      status.className = "status";

      status.innerText =
        "শিক্ষার্থীদের তথ্য লোড হচ্ছে...";

      status.style.display = "block";

      table.style.display = "none";


      const { data, error } =
        await supabaseClient
          .from("students")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(error);

        status.className =
          "status error";

        status.innerText =
          "❌ তথ্য লোড করা যায়নি: " +
          error.message;

        return;
      }


      allStudents = data || [];


      document.getElementById(
        "totalStudents"
      ).innerText =
        allStudents.length;


      document.getElementById(
        "totalApplications"
      ).innerText =
        allStudents.length;


      displayStudents(allStudents);

    }


    /* =========================
       DISPLAY STUDENTS
       ========================= */

    function displayStudents(students) {

      const status =
        document.getElementById("status");

      const table =
        document.getElementById("studentTable");

      const tbody =
        document.getElementById("studentTableBody");


      tbody.innerHTML = "";


      if (students.length === 0) {

        table.style.display = "none";

        status.style.display = "block";

        status.className =
          "status empty";

        status.innerText =
          "কোনো শিক্ষার্থীর তথ্য পাওয়া যায়নি।";

        return;
      }


      status.style.display = "none";

      table.style.display = "table";


      students.forEach(
        function(student, index) {

          const row =
            document.createElement("tr");


          let date = "-";


          if (student.created_at) {

            date =
              new Date(
                student.created_at
              ).toLocaleDateString(
                "bn-BD"
              );

          }


          row.innerHTML = `

            <td>${index + 1}</td>

            <td>${escapeHTML(
              student.full_name || "-"
            )}</td>

            <td>${escapeHTML(
              student.father_name || "-"
            )}</td>

            <td>${escapeHTML(
              student.mother_name || "-"
            )}</td>

            <td>${escapeHTML(
              student.mobile || "-"
            )}</td>

            <td>${escapeHTML(
              student.class_name || "-"
            )}</td>

            <td>${escapeHTML(
              student.address || "-"
            )}</td>

            <td>${date}</td>

          `;


          tbody.appendChild(row);

        }
      );

    }


    /* =========================
       SEARCH STUDENTS
       ========================= */

    function searchStudents() {

      const query =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();


      if (!query) {

        displayStudents(
          allStudents
        );

        return;
      }


      const filtered =
        allStudents.filter(
          function(student) {

            return (

              (student.full_name || "")
                .toLowerCase()
                .includes(query)

              ||

              (student.father_name || "")
                .toLowerCase()
                .includes(query)

              ||

              (student.mother_name || "")
                .toLowerCase()
                .includes(query)

              ||

              (student.mobile || "")
                .toLowerCase()
                .includes(query)

              ||

              (student.class_name || "")
                .toLowerCase()
                .includes(query)

            );

          }
        );


      displayStudents(filtered);

    }


    /* =========================
       SECURITY
       ========================= */

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================
       START
       ========================= */

    loadStudents();

  </script>

</body>
</html>
