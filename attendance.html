<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>উপস্থিতি | Rakib's Academy Online</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #0f766e;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 15px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      color: #0f766e;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .status {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .status label {
      flex: 1;
      margin: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
    }

    .status input {
      width: auto;
      margin-right: 5px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #0f766e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #0f766e;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      margin-top: 30px;
      background: #111827;
      color: white;
      text-align: center;
      padding: 18px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>Rakib's Academy Online</h1>
  <p>শিক্ষার্থীদের উপস্থিতি ব্যবস্থাপনা</p>
</header>

<main class="container">

  <div class="box">

    <h2>📋 উপস্থিতি</h2>

    <label>শিক্ষার্থীর নাম</label>
    <input type="text" placeholder="শিক্ষার্থীর পূর্ণ নাম">

    <label>শ্রেণি</label>
    <select>
      <option>শ্রেণি নির্বাচন করুন</option>
      <option>৬ষ্ঠ</option>
      <option>৭ম</option>
      <option>৮ম</option>
      <option>৯ম</option>
      <option>১০ম</option>
    </select>

    <label>তারিখ</label>
    <input type="date">

    <label>উপস্থিতির অবস্থা</label>

    <div class="status">
      <label>
        <input type="radio" name="attendance" value="present">
        ✅ উপস্থিত
      </label>

      <label>
        <input type="radio" name="attendance" value="absent">
        ❌ অনুপস্থিত
      </label>
    </div>

    <label>মন্তব্য</label>
    <textarea placeholder="প্রয়োজনে মন্তব্য লিখুন"></textarea>

    <button onclick="alert('উপস্থিতির তথ্য গ্রহণ করা হয়েছে।')">
      উপস্থিতি সংরক্ষণ করুন
    </button>

    <a href="index.html" class="back">
      ← মূল পেজে ফিরে যান
    </a>

  </div>

</main>

<footer>
  © 2026 Rakib's Academy Online
</footer>

</body>
</html>
