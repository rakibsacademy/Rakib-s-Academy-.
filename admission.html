<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>শিক্ষার্থী ভর্তি - Rakib's Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .box {
      max-width: 620px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      color: #0f766e;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
      font-size: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 18px;
      margin: 18px 0 8px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #0f766e;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #888;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
      word-break: break-word;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0f766e;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎓 শিক্ষার্থী ভর্তি</h1>

  <div class="subtitle">
    Rakib's Academy Online
  </div>

  <form id="admissionForm">

    <label>শিক্ষার্থীর নাম</label>
    <input
      type="text"
      id="full_name"
      placeholder="শিক্ষার্থীর পূর্ণ নাম"
      required
    >

    <label>পিতার নাম</label>
    <input
      type="text"
      id="father_name"
      placeholder="পিতার নাম"
      required
    >

    <label>মাতার নাম</label>
    <input
      type="text"
      id="mother_name"
      placeholder="মাতার নাম"
      required
    >

    <label>মোবাইল নম্বর</label>
    <input
      type="tel"
      id="mobile"
      placeholder="01XXXXXXXXX"
      required
    >

    <label>শ্রেণি</label>
    <select id="class_name" required>
      <option value="">শ্রেণি নির্বাচন করুন</option>
      <option value="৫ম">৫ম শ্রেণি</option>
      <option value="৬ষ্ঠ">৬ষ্ঠ শ্রেণি</option>
      <option value="৭ম">৭ম শ্রেণি</option>
      <option value="৮ম">৮ম শ্রেণি</option>
      <option value="৯ম">৯ম শ্রেণি</option>
      <option value="১০ম">১০ম শ্রেণি</option>
    </select>

    <label>ঠিকানা</label>
    <textarea
      id="address"
      placeholder="বর্তমান ঠিকানা"
    ></textarea>

    <button type="submit" id="submitBtn">
      ভর্তি আবেদন জমা দিন
    </button>

  </form>

  <div id="message"></div>

  <a class="back" href="index.html">
    ← মূল পেজে ফিরে যান
  </a>

</div>

<script>

  const SUPABASE_URL =
    "https://ihetuifvsqdzqkzbrxg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_CBx9Yy8hC-8YYC2F7ZB3Jw_v_BaxZm4";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  document
    .getElementById("admissionForm")
    .addEventListener("submit", async function(e) {

      e.preventDefault();

      const submitBtn =
        document.getElementById("submitBtn");

      const message =
        document.getElementById("message");

      submitBtn.disabled = true;
      submitBtn.innerText = "জমা হচ্ছে...";

      message.innerText = "";

      const studentData = {

        full_name:
          document.getElementById("full_name").value.trim(),

        father_name:
          document.getElementById("father_name").value.trim(),

        mother_name:
          document.getElementById("mother_name").value.trim(),

        mobile:
          document.getElementById("mobile").value.trim(),

        class_name:
          document.getElementById("class_name").value,

        address:
          document.getElementById("address").value.trim()
      };


      const { data, error } =
        await supabaseClient
          .from("students")
          .insert([studentData])
          .select();


      if (error) {

        console.error("SUPABASE ERROR:", error);

        message.style.color = "red";

        message.innerText =
          "❌ আবেদন জমা হয়নি। কারণ: " +
          error.message;

        submitBtn.disabled = false;
        submitBtn.innerText =
          "ভর্তি আবেদন জমা দিন";

        return;
      }


      message.style.color = "green";

      message.innerText =
        "✅ ভর্তি আবেদন সফলভাবে জমা হয়েছে!";

      document
        .getElementById("admissionForm")
        .reset();

      submitBtn.disabled = false;

      submitBtn.innerText =
        "ভর্তি আবেদন জমা দিন";

    });

</script>

</body>
</html>
